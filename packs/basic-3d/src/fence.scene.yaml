# 2 m fence section (posts at x = -1 and +1)
objects:
  - name: posts
    shape: box
    size: [0.1, 1.1, 0.1]
    position: [-1, 0, 0]
    repeat: { count: 2, offset: [2, 0, 0] }
    material: basic-3d/oak
  - { name: rail-top, shape: box, size: [2.1, 0.08, 0.05], position: [0, 0.85, 0.06], material: basic-3d/oak }
  - { name: rail-low, shape: box, size: [2.1, 0.08, 0.05], position: [0, 0.35, 0.06], material: basic-3d/oak }
